<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawd Wonder studio</title>
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script>window.SONG = { bpm: 120, off: 0, dur: 32 };</script>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="32" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/wonder/kit.js"></script>
<!-- one file per cut-to-cut segment of the reference (ref/BEATS.md) -->
<script src="src/wonder/s1_clawd.js"></script>
<script src="src/wonder/s2_mind.js"></script>
<script src="src/wonder/s3_light.js"></script>
<script src="src/wonder/s4_bloom.js"></script>
<script src="src/wonder/s5_flight.js"></script>
<script src="src/wonder/frame.js"></script>
</body>
</html>
